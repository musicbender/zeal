name: E2E Tests

# Single gate job, meant to be a required status check on main.
#
# - If the portfolio app (or anything it depends on) is NOT affected by the PR,
#   Vercel skips the build (see apps/portfolio/vercel.json `ignoreCommand`), so
#   there is no preview to wait for and the job passes immediately.
# - If the portfolio IS affected, the job waits for the Vercel Preview
#   deployment for the PR head commit to succeed, then runs the Playwright API
#   tests against it. A failed deployment or failed tests fail the check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same check Vercel's ignoreCommand uses, so "needs a preview" here
      # matches "Vercel will build a preview". Exit 0 = skip, exit 1 = build.
      - name: Check if portfolio is affected
        id: affected
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          if npx --yes turbo-ignore portfolio --fallback="origin/$BASE_REF"; then
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "Portfolio not affected - no preview needed, skipping E2E tests."
          else
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "Portfolio affected - waiting for Vercel preview, then running E2E tests."
          fi

      - name: Wait for Vercel preview deployment
        id: preview
        if: steps.affected.outputs.affected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Waiting for a Preview deployment of $SHA..."
          for i in $(seq 1 60); do
            # Newest Preview deployment for this commit (Vercel names the
            # environment "Preview", or "Preview – <project>").
            DEPLOYMENT_ID=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=50" \
              --jq '[.[] | select(.environment | startswith("Preview"))] | sort_by(.created_at) | last | .id // empty')

            if [ -n "$DEPLOYMENT_ID" ]; then
              STATUS=$(gh api "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses?per_page=1" \
                --jq '.[0] | "\(.state) \(.target_url // "")"')
              STATE="${STATUS%% *}"
              URL="${STATUS#* }"
              echo "Attempt $i: deployment $DEPLOYMENT_ID is '$STATE'"

              case "$STATE" in
                success)
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                failure|error|inactive)
                  echo "::error::Vercel preview deployment ended in state '$STATE'"
                  exit 1
                  ;;
              esac
            else
              echo "Attempt $i: no Preview deployment for $SHA yet"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the Vercel preview deployment"
          exit 1

      - name: Setup pnpm
        if: steps.affected.outputs.affected == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.affected.outputs.affected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.affected.outputs.affected == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.affected.outputs.affected == 'true'
        run: pnpm --filter portfolio-e2e install:browsers

      - name: Wait for deployment to be ready
        if: steps.affected.outputs.affected == 'true'
        run: |
          URL="${PORTFOLIO_BASE_URL}"
          echo "Waiting for $URL to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "$URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Deployment is ready!"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "Deployment not ready after 5 minutes"
          exit 1
        env:
          PORTFOLIO_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Run E2E tests against preview URL
        if: steps.affected.outputs.affected == 'true'
        working-directory: apps/portfolio-e2e
        run: pnpm test:e2e --project=api
        env:
          PORTFOLIO_BASE_URL: ${{ steps.preview.outputs.url }}
          PORTFOLIO_API_KEY: ${{ secrets.PORTFOLIO_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
