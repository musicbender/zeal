name: node-chargepoint PR Labels

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'packages/node-chargepoint/**'

concurrency:
  group: node-chargepoint-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-labels:
    name: Release Label (node-chargepoint)
    runs-on: ubuntu-latest
    steps:
      - name: Check for exactly one chargepoint release label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            const allowed = [
              'chargepoint:patch',
              'chargepoint:minor',
              'chargepoint:major',
              'chargepoint:skip-release',
            ];
            const found = allowed.filter((l) => labels.includes(l));
            if (found.length === 0) {
              core.setFailed(`This PR changes packages/node-chargepoint. Add exactly one label: ${allowed.join(', ')}`);
            } else if (found.length > 1) {
              core.setFailed(`Remove extra labels — found: ${found.join(', ')}`);
            }
